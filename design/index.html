<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家里有数 · 交互设计稿</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaece6;color:#26372f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus,textarea:focus,select:focus{outline:2px solid #739784;outline-offset:3px}button{color:inherit} .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:70px;padding:40px}.intro{width:310px}.eyebrow{font-size:12px;letter-spacing:3px;color:#6c8174}.intro h1{font-size:44px;line-height:1.25;letter-spacing:-2px;margin:24px 0}.intro p{color:#728077;line-height:1.9;font-size:14px}.steps{border-top:1px solid #cdd5cc;margin-top:30px;padding-top:20px}.steps div{margin:17px 0;font-size:13px}.steps span{color:#8b9d90;margin-right:13px}.phone{width:390px;height:820px;background:#f8f9f4;border:7px solid #fff;border-radius:44px;box-shadow:0 25px 80px #324b3520;position:relative;overflow:hidden;flex-shrink:0}.status{height:38px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.screen{height:calc(100% - 110px);overflow:auto;padding:24px 21px 30px;scrollbar-width:none}.topline{display:flex;justify-content:space-between;align-items:center}.tiny{font-size:11px;letter-spacing:1px;color:#849184}.avatar{border-radius:50%;background:#e3eadc;padding:10px;font-size:18px}h2{font-size:27px;letter-spacing:-1px;margin:8px 0 7px}h3{font-size:18px;margin:0}p{margin:0}.sub{font-size:12px;line-height:1.7;color:#819084}.search{width:100%;border:0;background:#ebeee5;padding:14px 16px;border-radius:16px;margin:23px 0 19px;text-align:left;color:#7c8b7e;font-size:13px;display:flex;gap:10px}.chips{display:flex;gap:8px;overflow:auto;padding:1px 0 18px;white-space:nowrap;scrollbar-width:none}.chip{padding:8px 14px;border-radius:20px;background:transparent;font-size:12px;color:#7b897f}.chip.active{background:#334f40;color:white}.section{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}.count{font-size:11px;color:#8a968a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}.card{padding:0;background:transparent;text-align:left;min-width:0}.cover{height:153px;border-radius:19px;overflow:hidden;background:#e9e5d9;position:relative}.cover svg{width:100%;height:100%}.cover img{height:100%;width:100%;object-fit:cover}.badge{position:absolute;bottom:10px;left:10px;background:#ffffffe0;border-radius:8px;padding:4px 7px;font-size:10px}.card h4{font-size:14px;margin:10px 0 4px;font-weight:600}.card p{font-size:11px;color:#8a9489}.note{border:1px solid #e0e6d9;border-radius:16px;padding:13px;margin-top:22px;font-size:11px;line-height:1.7;color:#82917d}.nav{height:72px;position:absolute;bottom:0;width:100%;background:#fbfcf7;border-top:1px solid #e9ede2;display:flex;justify-content:space-around;padding:9px 13px 13px}.nav button{background:transparent;color:#9aa497;font-size:10px;width:70px}.nav i{display:block;font-size:20px;font-style:normal;margin-bottom:3px}.nav .on{color:#355640;font-weight:700}.add{border-radius:14px;background:#355440;color:white;width:35px;height:35px;font-size:22px}.back,.textbtn{background:transparent;padding:5px 0;font-size:13px}.back{margin-bottom:22px;color:#70816f}.hero{height:215px;border-radius:23px;overflow:hidden;margin:18px 0}.hero svg,.hero img{width:100%;height:100%;object-fit:cover}.row{background:white;border-radius:17px;display:flex;gap:12px;padding:11px;margin-bottom:12px;width:100%;text-align:left;align-items:center}.thumb{width:73px;height:76px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#e7e7da}.thumb svg,.thumb img{height:100%;width:100%;object-fit:cover}.row b{font-size:14px;display:block;margin-bottom:6px}.row small{font-size:11px;color:#81917e;line-height:1.6}.tag{display:inline-block;padding:5px 9px;background:#e8eddf;border-radius:7px;font-size:11px;color:#67805e;margin:10px 5px 10px 0}.info{background:white;padding:16px;border-radius:17px;margin:10px 0 15px;font-size:13px;line-height:1.8}.label{font-size:11px;color:#8a9587;margin-bottom:5px}.primary{width:100%;background:#355440;color:white;border-radius:14px;padding:14px;font-size:14px}.secondary{width:100%;border:1px solid #d9e1d3;border-radius:14px;background:transparent;padding:13px;margin-top:10px;font-size:13px}.empty{padding:55px 10px;text-align:center;color:#8a9587;font-size:13px;line-height:2}.overlay{position:absolute;inset:0;background:#142a2150;z-index:5;display:flex;align-items:flex-end}.sheet{max-height:93%;overflow:auto;width:100%;background:#f8f9f4;padding:12px 23px 28px;border-radius:27px 27px 0 0}.handle{height:4px;width:35px;background:#d1d8cd;border-radius:9px;margin:0 auto 20px}.sheet h3{margin-bottom:7px}.field{display:block;font-size:12px;margin:18px 0;color:#60765f}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2d5;background:white;border-radius:11px;padding:11px;margin-top:7px;color:#304831}.field textarea{resize:vertical;min-height:70px}.hint{font-size:11px;color:#85917e;line-height:1.7;margin-top:8px}.upload{border:1px dashed #abbba1;border-radius:14px;padding:19px 10px;text-align:center;display:block;background:#eef2e6;color:#607858;font-size:13px;margin:15px 0}.upload input{display:block;font-size:10px;width:100%;margin-top:12px}.actions{display:flex;gap:10px}.actions button{flex:1}.cancel{background:#e8ecdf;border-radius:14px;padding:12px}.toast{position:absolute;bottom:85px;left:25px;right:25px;background:#294231;color:#fff;padding:13px;border-radius:12px;font-size:12px;text-align:center;z-index:10}.settings{padding:16px 0;border-bottom:1px solid #e3e8db;font-size:13px;display:flex;justify-content:space-between;width:100%;background:transparent;text-align:left}.danger{color:#9c6655}.foot{font-size:11px;color:#8c9987;margin-top:30px;line-height:1.8}.appmark{background:#355440;color:#fff;width:52px;height:52px;display:grid;place-items:center;font-size:26px;border-radius:18px;margin-bottom:18px}@media(max-width:760px){.intro{display:none}.stage{padding:0;min-height:100dvh}.phone{width:100%;height:100dvh;border:0;border-radius:0;max-width:460px}.screen{padding-top:20px}.cover{height:170px}}@media(min-width:761px) and (max-height:900px){.stage{padding:20px}.phone{height:calc(100vh - 40px);min-height:640px}}

.screen.home-screen{padding-top:0}.home-tools{position:sticky;top:0;z-index:2;background:#f8f9f4;margin:0 -21px 18px;padding:18px 21px 12px;border-bottom:1px solid #e8ecdf}.home-tools .search{margin:0 0 14px}.home-tools .chips{padding-bottom:0}.cover-options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.cover-choice{padding:3px;background:white;border:2px solid transparent;border-radius:13px;font-size:11px;color:#6f8068}.cover-choice svg{width:100%;height:68px;display:block;border-radius:8px}.cover-choice.selected{border-color:#355440;background:#edf2e6}.cover-preview{width:100px;height:95px;overflow:hidden;border-radius:14px;flex-shrink:0}.cover-preview img,.cover-preview svg{width:100%;height:100%;object-fit:cover}.cover-summary{display:flex;gap:15px;align-items:center;margin:15px 0}.cover-title{font-size:12px;font-weight:600}.cover-upload{margin:10px 0;padding:12px}.cover-state{min-height:19px}.cover-upload{cursor:pointer}.cover-upload input{width:1px;height:1px;position:absolute;opacity:0;padding:0;margin:0}.cover-upload:focus-within{outline:2px solid #739784;outline-offset:3px}
</style></head><body><div class="stage"><aside class="intro"><div class="eyebrow">HOME INVENTORY · DESIGN 01</div><h1>每件东西，<br>都有它的位置。</h1><p>家里有数 · 安卓端交互原型<br>让整理留下记录，让寻找少一点费心。</p><div class="steps"><div><span>01</span>进入容器，像翻相册一样查看</div><div><span>02</span>选择照片，轻松记录物品</div><div><span>03</span>搜索名字，直接找到位置</div><div><span>04</span>移动物品，更新收纳记录</div></div><p style="font-size:11px;margin-top:28px">可点击体验 · 示例数据 · 本地保存<br>手机相册在此以浏览器文件选择器演示</p></aside><main class="phone"><div class="status"><span>9:41</span><span>▮▮▮ &nbsp; ◒ &nbsp; ▰</span></div><div class="screen" id="screen"></div><nav class="nav" id="nav"></nav><div id="modal"></div><div id="toast"></div></main></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={containers:[{id:1,name:'藤编收纳篮',space:'客厅',note:'沙发旁边，下层置物架',art:'basket'},{id:2,name:'换季衣物箱',space:'卧室',note:'衣柜顶部，左侧',art:'clothes'},{id:3,name:'小小玩具屋',space:'儿童房',note:'靠窗的白色书架第二层',art:'toy'},{id:4,name:'家用工具箱',space:'储藏室',note:'进门右侧的架子上',art:'tool'}],items:[{id:11,cid:1,name:'羊毛盖毯',cat:'日用品',note:'冬天在沙发上用，冷水轻柔洗。',qty:1,art:'blanket',photos:[]},{id:12,cid:1,name:'无线耳机',cat:'电子产品',note:'备用充电线也放在这里。',qty:1,art:'headphone',photos:[]},{id:13,cid:2,name:'米色针织衫',cat:'衣服',note:'秋冬穿，M 码。',qty:1,art:'clothes',photos:[]},{id:14,cid:3,name:'木质积木',cat:'玩具',note:'一套，收好小零件。',qty:1,art:'toy',photos:[]},{id:15,cid:4,name:'家用电钻',cat:'工具',note:'充电器和钻头在工具箱夹层。',qty:1,art:'tool',photos:[]}]};
let db;try{db=JSON.parse(localStorage.getItem('home-design-v1'))||structuredClone(initial)}catch{db=structuredClone(initial)}
function syncSpaces(){db.spaces=[...new Set([...(Array.isArray(db.spaces)?db.spaces.filter(s=>typeof s==='string'&&s.trim()&&s!=='全部'):[]),...db.containers.map(c=>c.space)])]}
syncSpaces();
let tab='home',page='home',active=1,filter='全部',cat='全部',query='',lastPage='container',lastSearch=false;
function save(){try{localStorage.setItem('home-design-v1',JSON.stringify(db));return true}catch{toast('存储空间不足，请减少照片数量或大小');return false}}
function toast(s){$('toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('toast').innerHTML='',2600)}
function art(type){let shapes={basket:'<path d="M45 82h112l-10 65H55z" fill="#ae865c"/><path d="M49 92h104M51 105h100M53 118h96M55 132h92M68 85v60m20-60v60m20-60v60m20-60v60" stroke="#d8ba8e" stroke-width="3"/><path d="M70 84q0-52 30-52t30 52" fill="none" stroke="#9f794f" stroke-width="7"/><path d="M77 69q29-25 47 3l13 16H68z" fill="#ece6d5"/>',clothes:'<path d="m69 53 22-10h20l22 10 29 34-22 17-14-17v59H74V87l-14 17-22-17z" fill="#d1b89a"/><path d="M90 45q10 31 21 0M83 91v43m12-42v42m12-42v42m12-42v42" fill="none" stroke="#bba081" stroke-width="3"/>',toy:'<rect x="43" y="107" width="49" height="40" rx="5" fill="#c68961"/><rect x="99" y="96" width="51" height="51" rx="5" fill="#b3c19e"/><path d="m62 104 26-46 27 46z" fill="#d9bc77"/><circle cx="137" cy="64" r="21" fill="#d2a48b"/><path d="M43 151h113" stroke="#aaa58e" stroke-width="3"/>',tool:'<rect x="40" y="89" width="119" height="60" rx="9" fill="#6e7f6c"/><path d="M78 89V73h44v16" fill="none" stroke="#53634f" stroke-width="8"/><path d="M40 111h119" stroke="#4d6048" stroke-width="3"/><rect x="92" y="103" width="17" height="18" rx="3" fill="#d3bf85"/><path d="m67 66 15-33 10 5-15 33" fill="#9a9f8c"/>',blanket:'<rect x="45" y="55" width="110" height="96" rx="13" fill="#c2c8ae"/><path d="M48 73h104M48 92h104M48 111h104M48 130h104M68 57v93m24-93v93m24-93v93m24-93v93" stroke="#e3e4ce" stroke-width="3"/><path d="M51 151v10m12-10v10m12-10v10m12-10v10m12-10v10m12-10v10m12-10v10m12-10v10m12-10v10" stroke="#a4ae91" stroke-width="3"/>',headphone:'<path d="M63 112V88a37 37 0 0 1 74 0v24" fill="none" stroke="#f3eee0" stroke-width="14"/><rect x="54" y="99" width="21" height="40" rx="10" fill="#89977e"/><rect x="126" y="99" width="21" height="40" rx="10" fill="#89977e"/>'};return '<svg viewBox="0 0 200 185" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="185" fill="'+({basket:'#e8e0cf',clothes:'#eee5d9',toy:'#e8ebd8',tool:'#dfe5db',blanket:'#e5e9db',headphone:'#e5dfd2'}[type]||'#e8e0cf')+'"/><ellipse cx="100" cy="155" rx="65" ry="9" fill="#35452b" opacity=".07"/>'+(shapes[type]||shapes.basket)+'</svg>'}
function pic(i){return i.photos?.length?'<img alt="'+esc(i.name)+'" src="'+esc(i.photos[0])+'">':art(i.art)}
function cpic(c){return c.coverPhoto?'<img alt="'+esc(c.name)+'封面" src="'+esc(c.coverPhoto)+'">':art(c.art)}
function navigate(t){tab=t;page=t;filter='全部';render();$('screen').scrollTop=0}
function render(){ $('screen').classList.toggle('home-screen',page==='home');$('nav').innerHTML=[['home','▦','容器'],['search','⌕','查找'],['settings','☷','设置']].map(([t,i,n])=>`<button class="${tab===t?'on':''}" onclick="navigate('${t}')"><i>${i}</i>${n}</button>`).join('');if(page==='home')home();if(page==='container')container();if(page==='item')detail();if(page==='search')search();if(page==='settings')settings()}
function home(){const spaces=['全部',...db.spaces];$('screen').innerHTML=`<div class="home-tools"><button class="search" onclick="navigate('search')">⌕ <span>找找东西放在哪儿</span></button><div style="display:flex;gap:4px;align-items:flex-start"><div class="chips" style="flex:1;min-width:0">${spaces.map(s=>`<button class="chip ${filter===s?'active':''}" onclick="filter=this.textContent;home()">${esc(s)}</button>`).join('')}</div><button class="chip" style="border:1px dashed #a9b89e;flex-shrink:0" onclick="spaceManager()">⚙ 管理空间</button></div></div><div class="section"><h3>我的容器 <span class="count">${db.containers.length}</span></h3><button class="add" aria-label="创建容器" onclick="containerForm()">＋</button></div><div class="grid">${db.containers.filter(c=>filter==='全部'||c.space===filter).map(c=>`<button class="card" onclick="openContainer(${c.id})"><div class="cover">${cpic(c)}<span class="badge">${db.items.filter(i=>i.cid===c.id).length} 件物品</span></div><h4>${esc(c.name)}</h4><p>${esc(c.space)}</p></button>`).join('')}</div>`}
function openContainer(id){active=id;page='container';tab='home';render();$('screen').scrollTop=0}
function container(){const c=db.containers.find(c=>c.id===active);$('screen').innerHTML=`<button class="back" onclick="navigate('home')">‹ &nbsp;我的容器</button><div class="topline"><div><p class="tiny">${esc(c.space)} / 容器相册</p><h2>${esc(c.name)}</h2></div><button class="textbtn" onclick="containerForm(${c.id})">编辑</button></div><p class="sub">⌖ ${esc(c.note||'尚未填写具体位置')}</p><div class="hero">${cpic(c)}</div><div class="section"><h3>收纳在这里 <span class="count">${db.items.filter(i=>i.cid===c.id).length} 件</span></h3><button class="textbtn" onclick="itemForm()">＋ 添加物品</button></div><div class="grid">${db.items.filter(i=>i.cid===c.id).map(i=>`<button class="card" onclick="openItem(${i.id},false)"><div class="cover">${pic(i)}</div><h4>${esc(i.name)}</h4><p>${esc(i.cat)} · ${i.qty} 件</p></button>`).join('')}</div>${db.items.some(i=>i.cid===c.id)?'':'<div class="empty">这里还空着<br>从相册选张照片，记下第一件物品吧</div>'}<button class="secondary" style="margin-top:25px" onclick="itemForm()">＋ 从相册添加物品</button>`}
function openItem(id,fromSearch){active=id;lastSearch=fromSearch;page='item';render();$('screen').scrollTop=0}
function detail(){const i=db.items.find(i=>i.id===active),c=db.containers.find(c=>c.id===i.cid);$('screen').innerHTML=`<button class="back" onclick="${lastSearch?"navigate('search')":'openContainer('+c.id+')'}">‹ &nbsp;${lastSearch?'搜索结果':esc(c.name)}</button><div class="topline"><h2>${esc(i.name)}</h2><button class="textbtn" onclick="itemForm(${i.id})">编辑</button></div><span class="tag">${esc(i.cat)}</span><span class="tag">${i.qty} 件</span><div class="hero" style="height:255px">${pic(i)}</div>${(i.photos||[]).length>1?'<div class="grid">'+i.photos.slice(1).map(p=>'<div class="thumb"><img src="'+esc(p)+'" alt="物品补充照片"></div>').join('')+'</div>':''}<div class="info"><div class="label">存放位置</div><button class="textbtn" onclick="openContainer(${c.id})">⌖ ${esc(c.space)} → ${esc(c.name)} &nbsp; ›</button><div class="sub">${esc(c.note)}</div></div><div class="info"><div class="label">物品备注</div>${esc(i.note||'还没有备注')}</div><button class="primary" onclick="moveForm(${i.id})">移动到其他容器</button><p class="hint" style="text-align:center">移动后，搜索结果会显示新的存放位置</p>`}
function search(){ $('screen').innerHTML=`<div class="tiny">EVERYTHING, EASY TO FIND</div><h2>想找什么？</h2><p class="sub">搜名称、分类或备注，找到它的位置。</p><input id="q" class="search" placeholder="例如：电钻、衣服、充电器" value="${esc(query)}" oninput="query=this.value;results()"><div class="chips">${['全部','玩具','衣服','工具','日用品','电子产品','其他'].map(s=>`<button class="chip ${cat===s?'active':''}" onclick="cat='${s}';search()">${s}</button>`).join('')}</div><div id="results"></div>`;results()}
function results(){const list=db.items.filter(i=>(cat==='全部'||cat===i.cat)&&(i.name+' '+i.cat+' '+i.note).toLowerCase().includes(query.trim().toLowerCase()));$('results').innerHTML=`<div class="section"><h3>${query?'搜索结果':'全部物品'}</h3><span class="count">${list.length} 件</span></div>`+list.map(i=>{const c=db.containers.find(c=>c.id===i.cid);return `<button class="row" onclick="openItem(${i.id},true)"><div class="thumb">${pic(i)}</div><div><b>${esc(i.name)}</b><small>⌖ ${esc(c.space)} → ${esc(c.name)}<br>${esc(i.cat)} · ${i.qty} 件</small></div></button>`}).join('')+(list.length?'':'<div class="empty">没有找到相关物品<br>试试其他名称或分类</div>')}
function sheet(html){$('modal').innerHTML='<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div>'+html+'</div></div>'}
function closeSheet(){$('modal').innerHTML=''}

function commitSpaces(change){const before=JSON.stringify(db);change();if(!save()){db=JSON.parse(before);return false}return true}
function spaceManager(){sheet(`<div class="topline"><h3>空间管理</h3><button class="textbtn" onclick="closeSheet()">完成</button></div><p class="sub" style="margin-bottom:18px">按家里的实际布局，安排每一个空间。</p>${db.spaces.map((space,index)=>`<div class="row"><div style="flex:1;min-width:0;overflow-wrap:anywhere"><b>${esc(space)}</b><small>${db.containers.filter(c=>c.space===space).length} 个容器</small></div><button class="textbtn" onclick="spaceForm(${index})">修改</button><button class="textbtn danger" onclick="deleteSpaceForm(${index})">删除</button></div>`).join('')}${db.spaces.length?'':'<p class="empty">还没有空间，先添加一个吧。</p>'}<button class="primary" onclick="spaceForm()">＋ 新增空间</button>`)}
function spaceForm(index){const editing=Number.isInteger(index);sheet(`<h3>${editing?'修改空间':'新增空间'}</h3><p class="sub">${editing?'修改名称后，容器和物品的存放路径会同步更新。':'例如：厨房、阳台、书房。'}</p><form onsubmit="saveSpace(event,${editing?index:-1})"><label class="field">空间名称 *<input name="spaceName" required maxlength="20" placeholder="例如：厨房" value="${editing?esc(db.spaces[index]):''}"></label><p class="hint" style="margin-bottom:18px">名称不可重复；「全部」是筛选入口，不能用作空间名称。</p><div class="actions"><button type="button" class="cancel" onclick="spaceManager()">取消</button><button class="primary">保存空间</button></div></form>`)}
function saveSpace(e,index){e.preventDefault();const name=new FormData(e.target).get('spaceName').trim(),old=db.spaces[index];if(!name||name==='全部')return toast('请填写有效空间名称');if(db.spaces.some((s,n)=>s===name&&n!==index))return toast('已有同名空间，请换个名称');if(!commitSpaces(()=>{if(index<0)db.spaces.push(name);else{db.spaces[index]=name;db.containers.forEach(c=>{if(c.space===old)c.space=name})}}))return;if(filter===old)filter=name;render();spaceManager();toast(index<0?'空间已新增':'空间名称已更新')}
function deleteSpaceForm(index){const space=db.spaces[index],count=db.containers.filter(c=>c.space===space).length,targets=db.spaces.filter(s=>s!==space);sheet(`<h3>删除「${esc(space)}」？</h3><p class="sub" style="margin:14px 0">${count?'这里有 '+count+' 个容器。请选择新的空间，容器及其物品会一起保留。':'这是一个空空间，删除不会影响其他记录。'}</p>${count&&!targets.length?'<p class="hint" style="margin-bottom:20px">请先新增一个空间，再回来转移容器。</p><button class="primary" onclick="spaceForm()">先新增空间</button><button class="secondary" onclick="spaceManager()">返回</button>':`<form onsubmit="confirmDeleteSpace(event,${index})">${count?`<label class="field">容器迁往 *<select name="target" required><option value="" disabled selected>请选择目标空间</option>${targets.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></label>`:''}<div class="actions"><button type="button" class="cancel" onclick="spaceManager()">取消</button><button class="primary">${count?'转移容器并删除':'确认删除'}</button></div></form>`}`)}
function confirmDeleteSpace(e,index){e.preventDefault();const space=db.spaces[index],count=db.containers.filter(c=>c.space===space).length,target=new FormData(e.target).get('target');if(count&&(!db.spaces.includes(target)||target===space))return toast('请选择容器迁往的空间');if(!commitSpaces(()=>{db.containers.forEach(c=>{if(c.space===space)c.space=target});db.spaces.splice(index,1)}))return;if(filter===space)filter='全部';render();spaceManager();toast(count?'容器已转移，空间已删除':'空空间已删除')}

const defaultCovers=[['basket','藤编篮'],['clothes','衣物'],['toy','玩具'],['tool','工具箱'],['blanket','织物'],['headphone','数码']];
let coverDraft=null;
function containerForm(id){if(!db.spaces.length){spaceManager();toast('请先新增一个空间');return}const c=db.containers.find(c=>c.id===id)||{};coverDraft={photo:c.coverPhoto||'',art:c.art||'basket',busy:false,ticket:0};sheet(`<h3>${id?'编辑容器':'新建一个容器'}</h3><p class="sub">一个容器，就是一本物品相册。</p><form id="container-form" onsubmit="saveContainer(event,${id||0})"><label class="field">容器名称 *<input name="name" required maxlength="24" placeholder="例如：床底的白色收纳箱" value="${esc(c.name||'')}"></label><label class="field">所在空间 *<select name="space" required><option value="" disabled ${c.space?'':'selected'}>请选择空间</option>${db.spaces.map(space=>`<option value="${esc(space)}" ${c.space===space?'selected':''}>${esc(space)}</option>`).join('')}</select></label><div class="cover-summary"><div id="cover-preview" class="cover-preview"></div><div><div class="cover-title">容器封面</div><p class="hint">选择默认插画，或上传自己的照片。<br>保存后会同步显示在首页和容器详情。</p></div></div><div class="cover-options" role="group" aria-label="默认封面">${defaultCovers.map(([key,name])=>`<button type="button" class="cover-choice" data-cover="${key}" aria-label="封面：${name}" onclick="chooseCover('${key}')">${art(key)}${name}</button>`).join('')}</div><label class="upload cover-upload">＋ 从相册上传自定义封面<input name="coverFile" type="file" accept="image/*" onchange="uploadCover(this)"></label><p id="cover-state" class="hint cover-state" role="status"></p><label class="field">具体位置备注<textarea name="note" maxlength="300" placeholder="再具体一点，会更容易找到">${esc(c.note||'')}</textarea></label><div class="actions"><button type="button" class="cancel" onclick="closeSheet()">取消</button><button class="primary" id="save-container">${id?'保存修改':'创建容器'}</button></div></form>${id?`<button class="secondary danger" onclick="deleteContainer(${id})">删除容器</button>`:''}`);renderCoverDraft()}
function renderCoverDraft(){const d=coverDraft;$('cover-preview').innerHTML=d.photo?'<img alt="自定义封面预览" src="'+esc(d.photo)+'">':art(d.art);document.querySelectorAll('[data-cover]').forEach(el=>{const selected=!d.photo&&el.dataset.cover===d.art;el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',selected)});$('cover-state').textContent=d.busy?'正在处理照片…':d.photo?'已选择自定义照片；点击默认封面可替换。':'当前使用默认封面';$('save-container').disabled=d.busy}
function chooseCover(key){coverDraft.ticket++;coverDraft.busy=false;coverDraft.photo='';coverDraft.art=key;const input=document.querySelector('[name="coverFile"]');if(input)input.value='';renderCoverDraft()}
async function uploadCover(input){if(!input.files.length)return;const d=coverDraft,ticket=++d.ticket,form=input.form;d.busy=true;renderCoverDraft();try{const photo=await imageData(input.files[0]);if(d!==coverDraft||ticket!==d.ticket||!form.isConnected)return;d.photo=photo;d.busy=false;renderCoverDraft()}catch{if(d!==coverDraft||ticket!==d.ticket||!form.isConnected)return;d.busy=false;input.value='';renderCoverDraft();toast('无法读取封面，请选择 JPG、PNG 等图片')}}
function saveContainer(e,id){e.preventDefault();if(coverDraft.busy)return;const f=new FormData(e.target),v={name:f.get('name').trim(),space:f.get('space').trim(),note:f.get('note').trim(),art:coverDraft.art,coverPhoto:coverDraft.photo};if(!v.name||!db.spaces.includes(v.space))return toast('请填写名称并选择有效空间');const before=JSON.stringify(db);if(id)Object.assign(db.containers.find(c=>c.id===id),v);else{v.id=Date.now();db.containers.push(v);id=v.id}if(!save()){db=JSON.parse(before);return}closeSheet();openContainer(id);toast('容器已保存')}
function deleteContainer(id){if(db.items.some(i=>i.cid===id)){sheet('<h3>容器里还有物品</h3><p class="sub" style="margin:18px 0">请先逐件移动到其他容器，或在物品编辑页删除记录，再删除这个容器。</p><button class="primary" onclick="closeSheet()">知道了</button>');return}sheet(`<h3>删除这个空容器？</h3><p class="sub" style="margin:18px 0">删除后无法恢复。</p><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="db.containers=db.containers.filter(c=>c.id!==${id});save();closeSheet();navigate('home');toast('容器已删除')">确认删除</button></div>`)}
function itemForm(id){const i=db.items.find(i=>i.id===id)||{},cid=i.cid||active;sheet(`<h3>${id?'编辑物品':'把物品记下来'}</h3><p class="sub">${id?'完善信息，下次更好找。':'从手机相册选照片，位置已帮你填好。'}</p><form onsubmit="saveItem(event,${id||0},${cid})"><label class="upload">＋ ${id?'更换照片（不选则保留原图）':'从相册选择照片 *'}<input name="photos" type="file" accept="image/*" multiple ${id?'':'required'} onchange="fileHint(this)"></label><p id="filehint" class="hint">多选时默认每张照片记为一件物品。</p>${id?'':'<label class="hint"><input type="checkbox" name="merge"> 将所选照片合并为一件物品</label>'}<label class="field">物品名称<input name="name" value="${esc(i.name||'')}" maxlength="40" placeholder="例如：米色针织衫（可稍后填写）"></label><label class="field">分类<select name="cat">${['其他','玩具','衣服','工具','日用品','电子产品'].map(c=>`<option ${i.cat===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">数量<input name="qty" type="number" min="1" max="9999" required value="${i.qty||1}"></label><label class="field">备注<textarea name="note" maxlength="1000" placeholder="尺码、用途、配件……">${esc(i.note||'')}</textarea></label><div class="actions"><button type="button" class="cancel" onclick="closeSheet()">取消</button><button class="primary" id="saveitem">保存物品</button></div><p class="hint">原型使用浏览器文件选择器；导入照片仅保存在本机浏览器。</p></form>${id?`<button class="secondary danger" onclick="deleteItem(${id})">删除物品</button>`:''}`)}
function fileHint(el){$('filehint').textContent=el.files.length?'已选择 '+el.files.length+' 张照片':'尚未选择照片'}
async function imageData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}
async function saveItem(e,id,cid){e.preventDefault();const f=new FormData(e.target),files=[...e.target.elements.photos.files];if(files.length>12)return toast('一次最多选择 12 张照片');$('saveitem').disabled=true;$('saveitem').textContent='正在保存…';const before=JSON.stringify(db);try{const photos=await Promise.all(files.map(imageData)),v={name:f.get('name').trim()||'未命名物品',cat:f.get('cat'),qty:Number(f.get('qty')),note:f.get('note').trim()};if(id){const item=db.items.find(i=>i.id===id);Object.assign(item,v);if(photos.length)item.photos=photos}else{const groups=f.has('merge')?[photos]:photos.map(p=>[p]);groups.forEach((p,n)=>db.items.push({...v,id:Date.now()+n,cid,photos:p,art:'basket',name:v.name+(groups.length>1&&v.name!=='未命名物品'?' '+(n+1):'')}))}if(!save()){db=JSON.parse(before);$('saveitem').disabled=false;$('saveitem').textContent='保存物品';return}closeSheet();if(id){active=id;page='item';render()}else openContainer(cid);toast('物品已保存')}catch{db=JSON.parse(before);toast('无法读取照片，请选择 JPG、PNG 等图片');$('saveitem').disabled=false;$('saveitem').textContent='保存物品'}}
function deleteItem(id){sheet(`<h3>删除这件物品？</h3><p class="sub" style="margin:18px 0">仅删除此处记录，不影响手机原相册。</p><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="const c=db.items.find(i=>i.id===${id}).cid;db.items=db.items.filter(i=>i.id!==${id});save();closeSheet();openContainer(c);toast('物品记录已删除')">确认删除</button></div>`)}
function moveForm(id){const i=db.items.find(i=>i.id===id),list=db.containers.filter(c=>c.id!==i.cid);sheet('<h3>搬到哪里？</h3><p class="sub" style="margin-bottom:20px">选择新容器，更新「'+esc(i.name)+'」的位置。</p>'+list.map(c=>`<button class="row" onclick="moveItem(${id},${c.id})"><div class="thumb">${cpic(c)}</div><div><b>${esc(c.name)}</b><small>${esc(c.space)}</small></div><span style="margin-left:auto">›</span></button>`).join('')+(list.length?'':'<p class="empty">先创建另一个容器，再来移动物品吧。</p>')+'<button class="secondary" onclick="closeSheet()">取消</button>')}
function moveItem(id,cid){db.items.find(i=>i.id===id).cid=cid;save();closeSheet();render();toast('已移动到'+db.containers.find(c=>c.id===cid).name)}
function settings(){$('screen').innerHTML=`<div class="tiny">A LITTLE MORE ORDER</div><h2>收纳小管家</h2><p class="sub">你的记录，留在自己的设备里。</p><div class="info" style="margin-top:26px"><div class="appmark">⌂</div><h3>家里有数</h3><p class="sub" style="margin-top:8px">已记录 ${db.containers.length} 个容器、${db.items.length} 件物品</p></div><button class="settings" onclick="spaceManager()">空间管理 <span>›</span></button><button class="settings" onclick="exportData()">导出原型数据 <span>↓</span></button><label class="settings" style="display:block">恢复原型数据<input type="file" accept="application/json" style="font-size:11px;margin-top:12px;width:100%" onchange="importData(this)"></label><button class="settings" onclick="resetForm()">重新载入示例数据 <span>↻</span></button><div class="foot">交互设计稿 · v0.1<br>照片为插画占位，正式应用使用用户照片。<br>此处展示 App 内的容器相册，不创建系统相册。<br>本稿不包含账号、云同步和原生安卓权限流程。<br>清除浏览器数据会删除记录，请先导出备份。</div>`}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='家里有数-原型备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出记录及导入的照片')}
async function importData(el){if(!el.files.length)return;try{const v=JSON.parse(await el.files[0].text());if(!Array.isArray(v.containers)||!Array.isArray(v.items)||!v.containers.every(c=>Number.isFinite(c.id)&&typeof c.name==='string'&&typeof c.space==='string'&&(!c.coverPhoto||/^data:image\/(jpeg|png|webp);base64,/.test(c.coverPhoto)))||!v.items.every(i=>Number.isFinite(i.id)&&v.containers.some(c=>c.id===i.cid)&&typeof i.name==='string'&&(!i.photos||i.photos.every(p=>/^data:image\/(jpeg|png|webp);base64,/.test(p)))))throw Error();sheet('<h3>恢复备份？</h3><p class="sub" style="margin:18px 0">将替换当前原型中的记录，建议先导出当前数据。</p><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" id="restore">确认恢复</button></div>');$('restore').onclick=()=>{const previous=db;db=v;syncSpaces();if(!save()){db=previous;return}closeSheet();settings();toast('已恢复备份')}}catch{toast('备份格式不正确，无法恢复')}}
function resetForm(){sheet('<h3>重新载入示例？</h3><p class="sub" style="margin:18px 0">会清除当前原型记录，请先导出需要保留的数据。</p><div class="actions"><button class="cancel" onclick="closeSheet()">取消</button><button class="primary" onclick="db=structuredClone(initial);syncSpaces();save();closeSheet();navigate(\'home\')">确认重置</button></div>')}
render();
</script></body></html>
